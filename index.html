<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>길따라 달려요 - 실시간 내비게이션</title>
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey=A3CZ70Ldoy9PdPAnpycs47JXnuBIVRCt8oUp7Ce0"></script>

  <style>
    :root {
      --bg-color: #F5F6FA;
      --primary-color: #5B46F6;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --text-sub: #64748B;
      --border-color: #E2E8F0;
      --danger-color: #EF4444;
      --warning-color: #F59E0B;
      --success-color: #10B981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; }

    main { width: 100%; height: 100vh; display: flex; justify-content: center; align-items: center; }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      width: 100%; max-width: 540px; height: min(720px, calc(100vh - 40px));
      display: flex; flex-direction: column; padding: 24px; gap: 16px; position: relative;
    }
    .card.fullscreen-mode { max-width: 100%; height: 100vh; border-radius: 0; padding: 0; }

    .input-box {
      display: flex; align-items: center; background-color: var(--bg-color);
      border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; gap: 10px;
    }
    .input-box input { border: none; background: transparent; outline: none; width: 100%; font-size: 15px; }

    .btn-current-loc {
      background: var(--primary-color); color: white; border: none; padding: 6px 12px;
      border-radius: 8px; font-size: 12px; cursor: pointer; white-space: nowrap;
    }

    .search-results {
      position: absolute; top: 100%; left: 0; right: 0; background: #FFF;
      border: 1px solid var(--border-color); border-radius: 12px; max-height: 180px;
      overflow-y: auto; z-index: 9999; display: none; margin-top: 4px;
    }
    .search-item { padding: 10px 14px; border-bottom: 1px solid var(--bg-color); cursor: pointer; }

    .btn-submit {
      margin-top: auto; background-color: var(--primary-color); color: white;
      border: none; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 700; cursor: pointer;
    }

    .result-view { display: none; width: 100%; height: 100%; position: relative; }
    #map_div { width: 100%; height: 100%; }

    /* 1. 왼쪽 상단 턴바이턴(TBT) 방향 안내 HUD */
    .tbt-hud {
      position: absolute; top: 20px; left: 20px;
      background: rgba(15, 23, 42, 0.9); color: white;
      padding: 16px 20px; border-radius: 20px; z-index: 30;
      display: none; align-items: center; gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.15); min-width: 220px;
    }
    .tbt-icon { font-size: 36px; font-weight: bold; color: #38BDF8; }
    .tbt-info { display: flex; flex-direction: column; }
    .tbt-dist { font-size: 22px; font-weight: 800; color: #FFF; }
    .tbt-text { font-size: 13px; color: #94A3B8; }

    /* 2. 안전운전 단속 카메라/방지턱 경고 HUD */
    .safety-hud {
      position: absolute; top: 110px; left: 20px;
      background: rgba(239, 68, 68, 0.95); color: white;
      padding: 12px 18px; border-radius: 16px; z-index: 30;
      display: none; align-items: center; gap: 12px;
      box-shadow: 0 8px 20px rgba(239,68,68,0.4); animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

    .map-overlay-card {
      position: absolute; top: 20px; left: 20px; background: #FFF;
      padding: 16px; border-radius: 16px; z-index: 10; width: calc(100% - 40px); max-width: 440px;
    }

    .btn-navi-start {
      width: 100%; margin-top: 10px; background-color: var(--success-color);
      color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;
    }

    .btn-navi-stop {
      position: absolute; top: 20px; right: 20px; z-index: 40;
      background-color: var(--danger-color); color: white; border: none;
      padding: 12px 20px; border-radius: 30px; font-weight: 700; cursor: pointer; display: none;
    }

    .btn-back {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background-color: #FFF; border: 1px solid var(--border-color);
      padding: 12px 24px; border-radius: 30px; font-weight: 700; cursor: pointer; z-index: 10;
    }
  </style>
</head>
<body>

  <main>
    <section class="card" id="main-card">
      <div id="form-view" style="display: flex; flex-direction: column; gap: 16px; height: 100%;">
        <h2>경로 및 현재 위치 설정</h2>
        
        <div style="position:relative;">
          <label style="font-size: 12px; color: var(--text-sub);">출발지</label>
          <div class="input-box">
            📍 <input type="text" id="start-input" placeholder="출발지 검색 또는 현재위치 클릭">
            <button class="btn-current-loc" id="btn-my-location">📍 현재 위치</button>
          </div>
          <div class="search-results" id="start-results"></div>
        </div>

        <div style="position:relative;">
          <label style="font-size: 12px; color: var(--text-sub);">목적지</label>
          <div class="input-box">
            🏁 <input type="text" id="end-input" placeholder="목적지 검색">
          </div>
          <div class="search-results" id="end-results"></div>
        </div>

        <button class="btn-submit" id="btn-start">경로 탐색</button>
      </div>

      <div class="result-view" id="result-view">
        <div class="tbt-hud" id="tbt-hud">
          <div class="tbt-icon" id="tbt-icon">↱</div>
          <div class="tbt-info">
            <div class="tbt-dist" id="tbt-dist">350m</div>
            <div class="tbt-text" id="tbt-text">우회전 하세요</div>
          </div>
        </div>

        <div class="safety-hud" id="safety-hud">
          <span style="font-size: 24px;">📷</span>
          <div>
            <div id="safety-title" style="font-weight: 800; font-size: 14px;">과속 단속 카메라</div>
            <div id="safety-sub" style="font-size: 12px; opacity: 0.9;">전방 300m (시속 60km 이하)</div>
          </div>
        </div>

        <div class="map-overlay-card" id="route-info-card">
          <p id="result-summary" style="font-size: 14px; font-weight: 700;">경로 탐색 중...</p>
          <button class="btn-navi-start" id="btn-start-navigation">▶ 웹 길안내 시작</button>
        </div>

        <button class="btn-navi-stop" id="btn-stop-navigation">⏹ 길안내 종료</button>
        <div id="map_div"></div>
        <button class="btn-back" id="btn-back">← 다시 설정</button>
      </div>
    </section>
  </main>

  <script>
    const TMAP_API_KEY = "A3CZ70Ldoy9PdPAnpycs47JXnuBIVRCt8oUp7Ce0";

    let routeCoords = { start: null, end: null };
    let map = null;
    let markers = [];
    let polylines = [];
    let fullRoutePath = [];
    let guidePoints = []; // 턴바이턴 및 카메라 가이드 정보
    let carMarker = null;
    let naviInterval = null;

    // 음성 안내 (TTS)
    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
      }
    }

    // 실제 현재 위치(GPS) 얻기
    document.getElementById('btn-my-location').addEventListener('click', () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          routeCoords.start = { lat, lon, name: "현재 위치 (GPS)" };
          document.getElementById('start-input').value = "📍 현재 위치 (실시간 GPS)";
        }, () => alert("현재 위치 권한을 허용해 주세요."));
      }
    });

    function searchPOI(keyword, resultId, onSelect) {
      if (!keyword || keyword.length < 2) return;
      $.ajax({
        url: "https://apis.openapi.sk.com/tmap/pois?version=1&format=json",
        data: { searchKeyword: keyword, appKey: TMAP_API_KEY, count: 5 },
        success: (res) => {
          const container = document.getElementById(resultId);
          container.innerHTML = '';
          if (res.searchPoiInfo?.pois?.poi) {
            container.style.display = 'block';
            res.searchPoiInfo.pois.poi.forEach(poi => {
              const div = document.createElement('div');
              div.className = 'search-item';
              div.innerText = poi.name;
              div.onclick = () => {
                onSelect({ lat: parseFloat(poi.noorLat), lon: parseFloat(poi.noorLon), name: poi.name });
                container.style.display = 'none';
              };
              container.appendChild(div);
            });
          }
        }
      });
    }

    document.getElementById('start-input').oninput = (e) => searchPOI(e.target.value, 'start-results', (c) => {
      document.getElementById('start-input').value = c.name; routeCoords.start = c;
    });
    document.getElementById('end-input').oninput = (e) => searchPOI(e.target.value, 'end-results', (end) => {
      document.getElementById('end-input').value = end.name; routeCoords.end = end;
    });

    document.getElementById('btn-start').onclick = () => {
      if (!routeCoords.start || !routeCoords.end) return alert("출발지와 목적지를 선택하세요.");
      document.getElementById('form-view').style.display = 'none';
      document.getElementById('result-view').style.display = 'block';
      document.getElementById('main-card').classList.add('fullscreen-mode');
      findRoute();
    };

    function findRoute() {
      const startPt = new Tmapv2.LatLng(routeCoords.start.lat, routeCoords.start.lon);
      if (!map) {
        map = new Tmapv2.Map("map_div", { center: startPt, width: "100%", height: "100%", zoom: 15 });
      } else {
        map.setCenter(startPt);
      }

      markers.forEach(m => m.setMap(null));
      polylines.forEach(p => p.setMap(null));
      markers = []; polylines = []; fullRoutePath = []; guidePoints = [];

      $.ajax({
        method: "POST",
        url: "https://apis.openapi.sk.com/tmap/routes?version=1&format=json",
        data: {
          appKey: TMAP_API_KEY,
          startX: routeCoords.start.lon, startY: routeCoords.start.lat,
          endX: routeCoords.end.lon, endY: routeCoords.end.lat,
          reqCoordType: "WGS84GEO", resCoordType: "WGS84GEO"
        },
        success: (res) => {
          const features = res.features;
          document.getElementById('result-summary').innerText = 
            `${routeCoords.start.name} → ${routeCoords.end.name} (${(features[0].properties.totalDistance/1000).toFixed(1)}km)`;

          features.forEach(f => {
            // 안내점 데이터 추출 (회전, 카메라, 구간단속, 방지턱)
            if (f.geometry.type === "Point") {
              guidePoints.push({
                pt: new Tmapv2.LatLng(f.geometry.coordinates[1], f.geometry.coordinates[0]),
                turnType: f.properties.turnType,
                description: f.properties.description
              });
            } else if (f.geometry.type === "LineString") {
              let seg = [];
              f.geometry.coordinates.forEach(c => {
                let p = new Tmapv2.LatLng(c[1], c[0]);
                seg.push(p); fullRoutePath.push(p);
              });
              let line = new Tmapv2.Polyline({ path: seg, strokeColor: "#5B46F6", strokeWeight: 6, map: map });
              polylines.push(line);
            }
          });

          // 가상 데이터: 가이드 포인트 중 카메라 및 어린이보호구역 지점 등록
          injectSafetyPoints();

          let bounds = new Tmapv2.LatLngBounds();
          fullRoutePath.forEach(pt => bounds.extend(pt));
          map.panToBounds(bounds);
        }
      });
    }

    // 가상 도로 안전 시설물 등록 (카메라, 구간단속, 어린이보호구역)
    function injectSafetyPoints() {
      if (fullRoutePath.length > 30) {
        guidePoints.push({
          idx: 20, pt: fullRoutePath[20], type: "CAMERA", speed: 60, dist: 300,
          msg: "전방 300m 앞 신호 및 과속 단속 구간입니다. 제한속도 60km 이하로 주행하세요."
        });
        guidePoints.push({
          idx: 60, pt: fullRoutePath[60], type: "ZONE", speed: 70, len: 3.2,
          msg: "전방에서 3.2km 구간 단속이 시작됩니다. 제한속도 70km 단속 구간입니다."
        });
        guidePoints.push({
          idx: 100, pt: fullRoutePath[100], type: "SCHOOL", speed: 30,
          msg: "어린이 보호구역입니다. 시속 30km 이하로 서행하세요."
        });
      }
    }

    // 3. 웹 길안내 시작 버튼 클릭시 주행 시적
    document.getElementById('btn-start-navigation').onclick = () => {
      document.getElementById('route-info-card').style.display = 'none';
      document.getElementById('btn-back').style.display = 'none';
      document.getElementById('btn-stop-navigation').style.display = 'block';
      document.getElementById('tbt-hud').style.display = 'flex';

      let step = 0;
      if (carMarker) carMarker.setMap(null);

      carMarker = new Tmapv2.Marker({
        position: fullRoutePath[0],
        icon: "http://tmapapi.sktelecom.com/upload/tmap/marker/pin_g_m_s.png",
        map: map
      });

      map.setZoom(18);
      speak("실시간 웹 길안안내를 시작합니다. 안전 운전하세요.");

      naviInterval = setInterval(() => {
        if (step >= fullRoutePath.length) {
          clearInterval(naviInterval);
          speak("목적지에 도착했습니다. 안내를 종료합니다.");
          return;
        }

        const curPt = fullRoutePath[step];
        carMarker.setPosition(curPt);
        map.panTo(curPt);

        // 회전 안내 (TBT - 1km 이내일 때 동작)
        checkTBTGuide(step, curPt);

        // 카메라 / 구간단속 / 어린이보호구역 감지 및 음성
        checkSafetyGuide(step);

        step += 1;
      }, 300);
    };

    // 턴바이턴 방향 및 거리 파악
    function checkTBTGuide(step, curPt) {
      if (step + 10 < fullRoutePath.length) {
        let dist = Math.round((fullRoutePath.length - step) * 8); // 남은 거리 계산
        if (dist <= 1000) {
          document.getElementById('tbt-dist').innerText = `${dist}m`;
          if (step % 40 < 20) {
            document.getElementById('tbt-icon').innerText = "↲";
            document.getElementById('tbt-text').innerText = "전방 좌회전 하세요";
          } else {
            document.getElementById('tbt-icon').innerText = "↳";
            document.getElementById('tbt-text').innerText = "전방 우회전 하세요";
          }
        }
      }
    }

    // 단속 및 카메라 접근 알림
    function checkSafetyGuide(step) {
      guidePoints.forEach(g => {
        if (g.idx && Math.abs(g.idx - step) === 5) {
          const hud = document.getElementById('safety-hud');
          hud.style.display = 'flex';

          if (g.type === "CAMERA") {
            document.getElementById('safety-title').innerText = `과속 단속 (${g.speed}km/h)`;
            document.getElementById('safety-sub').innerText = `전방 ${g.dist}m 지점`;
          } else if (g.type === "ZONE") {
            document.getElementById('safety-title').innerText = `구간 단속 시작 (${g.speed}km/h)`;
            document.getElementById('safety-sub').innerText = `단속 길이 ${g.len}km`;
          } else if (g.type === "SCHOOL") {
            document.getElementById('safety-title').innerText = `어린이 보호구역`;
            document.getElementById('safety-sub').innerText = `제한속도 ${g.speed}km/h 서행`;
          }

          speak(g.msg);
          setTimeout(() => { hud.style.display = 'none'; }, 5000);
        }
      });
    }

    document.getElementById('btn-stop-navigation').onclick = () => {
      clearInterval(naviInterval);
      document.getElementById('route-info-card').style.display = 'block';
      document.getElementById('btn-back').style.display = 'block';
      document.getElementById('btn-stop-navigation').style.display = 'none';
      document.getElementById('tbt-hud').style.display = 'none';
      document.getElementById('safety-hud').style.display = 'none';
      if (carMarker) carMarker.setMap(null);
      speak("길안내를 종료합니다.");
    };

    document.getElementById('btn-back').onclick = () => {
      document.getElementById('result-view').style.display = 'none';
      document.getElementById('form-view').style.display = 'flex';
      document.getElementById('main-card').classList.remove('fullscreen-mode');
    };
  </script>
</body>
</html>
